      x-eov-operation-handler: controllers/DefaultController
components:
  schemas:
    Category:
      example:
        id: 0
        name: name
      properties:
        id:
          type: integer
        name:
          type: string
      type: object
    Book:
      example:
        id: 0
        title: title
        author: author
        price: price
        category_id: 6
        cover: cover
        category_name: category_name
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        price:
          description: pg NUMERIC returns a string
          type: string
        category_id:
          type: integer
        cover:
          nullable: true
          type: string
        category_name:
          type: string
      type: object
    Error:
      example:
        error: error
      properties:
        error:
          type: string
      type: object
    _api_categories_post_request:
      properties:
        name:
          maxLength: 100
          type: string
      required:
      - name
      type: object
    _api_books_post_request:
      properties:
        title:
          maxLength: 200
          type: string
        author:
          maxLength: 150
          type: string
        price:
          maximum: 99999999.99
          minimum: 0
          multipleOf: 0.01
          type: number
        category_id:
          minimum: 1
          type: integer
        cover:
          description: "PNG/JPEG/WebP, maximum 2 MB"
          format: binary
          type: string
        remove_cover:
          description: "PUT only: remove existing cover if no new cover"
          enum:
          - "true"
          - "false"
          type: string
      required:
      - author
      - category_id
      - price
      - title
      type: object
