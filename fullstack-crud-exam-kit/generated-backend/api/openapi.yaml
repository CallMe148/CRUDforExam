          description: Duplicate or foreign key conflict
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Server error
      summary: GET /api/categories
      tags:
      - categories
      x-eov-operation-handler: controllers/CategoriesController
